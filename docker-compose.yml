services:
  poker:
    build: .
    image: poker-night:latest
    container_name: poker-night
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "3443:3443"
    environment:
      PORT: "3000"
      HTTPS_PORT: "3443"
      # IP adresa alebo hostname tvojho počítača v sieti — pridá sa do self-signed certifikátu
      PUBLIC_HOST: "${PUBLIC_HOST:-}"
      # Odkiaľ brať skutočnú IP hráča pre limity: cloudflare (CF-Connecting-IP, verejná adresa cez poker-tunnel),
      # xff (Tailscale Funnel / Caddy), off (priame spojenie). Hráči v LAN na :3000 si hlavičku vedia podvrhnúť — platia im aj tak globálne limity.
      TRUST_PROXY: "${TRUST_PROXY:-cloudflare}"
      # Verejná adresa hry pre odkazy v e-mailoch (overenie e-mailu, obnovenie hesla), napr. https://192.168.1.10:3443
      PUBLIC_URL: "${PUBLIC_URL:-}"
      # Bez MAIL_OUTBOX_DIR sa e-maily len vypíšu do logu kontajnera (docker logs poker-night) — odkaz sa dá skopírovať odtiaľ
      # Voliteľné vlastné STUN/TURN servery (JSON), napr.:
      # ICE_SERVERS: '[{"urls":"stun:stun.l.google.com:19302"}]'
    volumes:
      # Uložené stoly (prežijú reštart aj rebuild kontajnera); zmazanie: docker compose down -v
      - poker-data:/app/data

volumes:
  poker-data:
